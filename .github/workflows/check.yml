name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet fantomas --check scripts
      - run: dotnet fsi scripts/check.fsx --verify
      - run: dotnet fsi scripts/test-check.fsx
